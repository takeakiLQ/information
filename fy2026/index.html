<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FY2026 事業戦略</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* ===== ヘッダー ===== */
        .header {
            background: rgba(12, 12, 12, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 24px;
            border-bottom: 2px solid transparent;
            border-image: linear-gradient(90deg, transparent, #FFEB00, #FFD800, #FFEB00, transparent) 1;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .header h1 {
            font-size: clamp(14px, 3vw, 22px);
            font-weight: 900;
            background: linear-gradient(135deg, #FFEB00 0%, #FFD800 60%, #FFC700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: rgba(255, 235, 0, 0.65);
            text-decoration: none;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }
        .back-link:hover { color: #FFEB00; }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        /* ページカウンター */
        .page-badge {
            font-size: 13px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 1px;
            white-space: nowrap;
        }
        .page-badge .cur {
            color: #FFEB00;
            font-size: 18px;
        }

        .dl-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 18px;
            background: linear-gradient(135deg, #FFEB00, #FFD800);
            color: #0a0a0a;
            text-decoration: none;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: box-shadow 0.25s, transform 0.2s;
            white-space: nowrap;
        }
        .dl-btn:hover {
            box-shadow: 0 6px 24px rgba(255, 235, 0, 0.4);
            transform: translateY(-2px);
        }

        /* ===== スクロールコンテナ ===== */
        .slides {
            padding: 32px 16px 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 外枠 */
        .slides-frame {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* 各スライド */
        .slide-item {
            width: 100%;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255, 235, 0, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            cursor: zoom-in;
        }

        /* ページ番号バッジ */
        .slide-number {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(10, 10, 10, 0.72);
            border: 1px solid rgba(255, 235, 0, 0.3);
            color: rgba(255, 235, 0, 0.8);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            letter-spacing: 1px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        .slide-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== ライトボックス ===== */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 16px;
            cursor: zoom-out;
        }
        .lightbox.open { display: flex; }
        .lightbox-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 4px;
            box-shadow: 0 0 80px rgba(0,0,0,0.8);
            cursor: default;
        }
        .lightbox-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: rgba(255,235,0,0.15);
            border: 1px solid rgba(255,235,0,0.4);
            color: #FFEB00;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 18px;
            line-height: 34px;
            text-align: center;
            cursor: pointer;
            z-index: 1001;
        }
        .lightbox-close:hover { background: rgba(255,235,0,0.3); }

        /* ===== フローティング「先頭へ」ボタン ===== */
        .top-btn {
            position: fixed;
            bottom: 28px;
            right: 24px;
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #FFEB00, #FFD800);
            color: #0a0a0a;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(255, 235, 0, 0.4);
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 200;
        }
        .top-btn.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .top-btn:hover {
            box-shadow: 0 8px 28px rgba(255, 235, 0, 0.6);
        }

        /* ===== レスポンシブ ===== */
        @media (max-width: 600px) {
            .header { padding: 12px 14px; }
            .slides { padding: 16px 8px 64px; }
            .dl-btn { padding: 7px 14px; font-size: 11px; }
            .top-btn { width: 40px; height: 40px; bottom: 20px; right: 16px; }
        }
    </style>
</head>
<body>

    <!-- ヘッダー -->
    <header class="header">
        <div class="header-left">
            <h1>FY2026 事業戦略</h1>
        </div>
        <div class="header-right">
            <div class="page-badge">
                <span class="cur" id="curPage">1</span>
                <span> / 37</span>
            </div>
            <a href="FY2026事業戦略_20260401.pdf" class="dl-btn" download>
                <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                    <path d="M6.5 1.5v7M6.5 8.5L4 6M6.5 8.5L9 6M1.5 11h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                PDF
            </a>
        </div>
    </header>

    <!-- スライド一覧（JSで生成） -->
    <div class="slides">
        <div class="slides-frame" id="slidesFrame"></div>
    </div>

    <!-- ライトボックス -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <div class="lightbox-close" onclick="closeLightbox()">&#10005;</div>
        <img class="lightbox-img" id="lightboxImg" src="" alt="" onclick="event.stopPropagation()">
    </div>

    <!-- 先頭へ戻るボタン -->
    <button class="top-btn" id="topBtn" aria-label="先頭へ戻る" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <path d="M9 14V4M9 4L5 8M9 4L13 8" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
    </button>

    <script>
        var TOTAL = 37;
        var frame  = document.getElementById('slidesFrame');
        var curEl  = document.getElementById('curPage');
        var topBtn = document.getElementById('topBtn');
        var lightbox = document.getElementById('lightbox');
        var lightboxImg = document.getElementById('lightboxImg');

        function pad(n) { return String(n).padStart(2, '0'); }

        function openLightbox(src, alt) {
            lightboxImg.src = src;
            lightboxImg.alt = alt;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }
        function closeLightbox() {
            lightbox.classList.remove('open');
            document.body.style.overflow = '';
        }
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeLightbox();
        });

        /* スライド要素を全件生成 */
        for (var i = 1; i <= TOTAL; i++) {
            var item = document.createElement('div');
            item.className = 'slide-item';
            item.dataset.page = i;

            var badge = document.createElement('div');
            badge.className = 'slide-number';
            badge.textContent = i + ' / ' + TOTAL;

            var img = document.createElement('img');
            img.className = 'slide-img';
            img.src = 'svg/slide-' + pad(i) + '.svg';
            img.alt = i + 'ページ目';
            img.loading = (i <= 3) ? 'eager' : 'lazy';
            img.decoding = 'async';
            (function(src, alt) {
                item.addEventListener('click', function() { openLightbox(src, alt); });
            })(img.src, img.alt);

            item.appendChild(badge);
            item.appendChild(img);
            frame.appendChild(item);
        }

        /* IntersectionObserver でヘッダーのページ番号を更新 */
        var io = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    curEl.textContent = entry.target.dataset.page;
                }
            });
        }, { rootMargin: '-40% 0px -55% 0px', threshold: 0 });

        frame.querySelectorAll('.slide-item').forEach(function(el) { io.observe(el); });

        /* 先頭へボタンの表示制御 */
        window.addEventListener('scroll', function() {
            topBtn.classList.toggle('visible', window.scrollY > 400);
        }, { passive: true });
    </script>
</body>
</html>
