<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIC Information Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
            background: #0a0a0a;
            background-image:
                radial-gradient(circle at 15% 25%, rgba(255, 235, 0, 0.07) 0px, transparent 30%),
                radial-gradient(circle at 85% 75%, rgba(255, 235, 0, 0.07) 0px, transparent 30%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* ヘッダー */
        .site-header {
            padding: 48px 32px 36px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 235, 0, 0.12);
        }

        .site-title {
            font-size: clamp(22px, 5vw, 40px);
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #FFEB00 0%, #FFD800 60%, #FFC700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .site-subtitle {
            margin-top: 10px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* メインコンテンツ */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px 60px;
            gap: 28px;
        }

        .section-label {
            font-size: 11px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255, 235, 0, 0.5);
            margin-bottom: 20px;
            text-align: center;
        }

        /* カードグリッド */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 800px;
        }

        .card {
            display: block;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 235, 0, 0.15);
            border-radius: 16px;
            padding: 36px 32px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.3s ease,
                        border-color 0.3s ease,
                        background 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255, 235, 0, 0.06) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 16px;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 235, 0, 0.5);
            box-shadow: 0 20px 60px rgba(255, 235, 0, 0.12), 0 8px 24px rgba(0, 0, 0, 0.6);
            background: rgba(255, 235, 0, 0.04);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-tag {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #0a0a0a;
            background: linear-gradient(135deg, #FFEB00, #FFD800);
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: clamp(18px, 3vw, 24px);
            font-weight: 800;
            color: #ffffff;
            line-height: 1.3;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .card-description {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .card-arrow {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #FFEB00;
            letter-spacing: 1px;
        }

        .card-arrow svg {
            transition: transform 0.3s ease;
        }

        .card:hover .card-arrow svg {
            transform: translateX(6px);
        }

        /* フッター */
        .site-footer {
            padding: 20px 32px;
            text-align: center;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* レスポンシブ */
        @media (max-width: 600px) {
            .site-header {
                padding: 36px 20px 28px;
            }
            .main {
                padding: 32px 16px 48px;
            }
            .card {
                padding: 28px 24px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="site-title">Information Portal</div>
        <div class="site-subtitle">ZIC Group &nbsp;|&nbsp; Internal Documents</div>
    </header>

    <main class="main">
        <p class="section-label">コンテンツを選択してください</p>
        <div class="cards">
            <!-- FY2024-2025 タイムライン -->
            <a href="timeline-v2.html" class="card">
                <span class="card-tag">FY2024 &ndash; 2025</span>
                <div class="card-title">FY2024-FY2025<br>タイムライン</div>
                <div class="card-description">
                    FY2024〜FY2025における各部門の<br>主要トピック・実績をまとめたタイムラインです。
                </div>
                <div class="card-arrow">
                    閲覧する
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="#FFEB00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>

            <!-- FY2026 事業戦略 -->
            <a href="fy2026/index.html" class="card">
                <span class="card-tag">FY2026</span>
                <div class="card-title">FY2026<br>事業戦略</div>
                <div class="card-description">
                    FY2026の全社・各部門事業戦略を<br>スライド形式で閲覧できます。
                </div>
                <div class="card-arrow">
                    閲覧する
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                        <path d="M3 8H13M13 8L9 4M13 8L9 12" stroke="#FFEB00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </a>
        </div>
    </main>

    <footer class="site-footer">
        &copy; 2026 ZIC Group &nbsp;&mdash;&nbsp; Internal Use Only
    </footer>
</body>
</html>
